name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit:
    name: RosterLabKit unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (includes an offline end-to-end run on the demo league)
        working-directory: RosterLabKit
        run: swift test
